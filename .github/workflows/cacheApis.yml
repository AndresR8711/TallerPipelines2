name: On This Day - HTML a PDF

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Mes en formato MM (ej: 08)'
        required: true
        type: string
      day:
        description: 'Día en formato DD (ej: 20)'
        required: true
        type: string

jobs:
  fetch-events:
    name: Obtener eventos de la API
    runs-on: ubuntu-latest
    env:
      LANG: ${{ vars.LANG }}
      MONTH: ${{ github.event.inputs.month }}
      DAY: ${{ github.event.inputs.day }}

    steps:
      - name: Configurar cache para respuesta API
        uses: actions/cache@v4
        id: cache
        with:
          path: cache
          key: onthisday-${{ env.LANG }}-${{ env.MONTH }}-${{ env.DAY }}

      - name: Crear carpeta cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: mkdir -p cache

      - name: Llamar API solo si no existe en cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -s "https://byabbe.se/on-this-day/${MONTH}/${DAY}/events.json?lang=${LANG}" > cache/response.json

    #  - name: Verificar respuesta en cache#
       # run: cat cache/response.json | jq '.selected | length'#

      - name: Exportar matriz dinámica
        id: matrix
        run: |
          EVENTS=$(jq -c '.selected' cache/response.json)
          echo "events=$EVENTS" >> $GITHUB_OUTPUT

    outputs:
      events: ${{ steps.matrix.outputs.events }}
      lang: ${{ env.LANG }}
      month: ${{ env.MONTH }}
      day: ${{ env.DAY }}

  generate-pdfs:
    name: Generar PDFs
    needs: fetch-events
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # resiliencia: no detiene todo si uno falla
      matrix:
        event: ${{ fromJson(needs.fetch-events.outputs.events) }}

    env:
      LANG: ${{ needs.fetch-events.outputs.lang }}
      MONTH: ${{ needs.fetch-events.outputs.month }}
      DAY: ${{ needs.fetch-events.outputs.day }}

    steps:
      - name: Extraer título y URL
        id: info
        run: |
          TITLE=$(echo '${{ matrix.event }}' | jq -r '.pages[0].title' | tr ' ' '_' | tr -cd '[:alnum:]_-')
          URL=$(echo '${{ matrix.event }}' | jq -r '.pages[0].content_urls.desktop.page')
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Convertir HTML a PDF
        uses: fifsky/html-to-pdf-action@master
        with:
          htmlFile: ${{ steps.info.outputs.url }}
          outputFile: ${{ env.MONTH }}-${{ env.DAY }}-${{ steps.info.outputs.title }}.pdf

      - name: Subir artefacto PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MONTH }}-${{ env.DAY }}-${{ steps.info.outputs.title }}
          path: ${{ env.MONTH }}-${{ env.DAY }}-${{ steps.info.outputs.title }}.pdf
          retention-days: 1
