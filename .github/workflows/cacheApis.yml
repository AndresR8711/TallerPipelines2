name: On This Day - Obtener Eventos

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Mes en formato MM (ej: 08)'
        required: true
        type: string
      day:
        description: 'Día en formato DD (ej: 20)'
        required: true
        type: string

env:
  LANG: ${{ vars.LANG || 'es' }}

jobs:
  fetch-events:
    name: Obtener eventos históricos
    runs-on: ubuntu-latest
    outputs:
      total-events: ${{ steps.count-events.outputs.total }}
      api-data: ${{ steps.save-data.outputs.api-data }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar clave de cache
        id: cache-key
        run: |
          echo "key=onthisday-$LANG-${{ inputs.month }}-${{ inputs.day }}" >> $GITHUB_OUTPUT

      - name: Restaurar respuesta desde cache
        uses: actions/cache@v4
        id: api-cache
        with:
          path: api-response.json
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            onthisday-$LANG-${{ inputs.month }}-${{ inputs.day }}

      - name: Llamar API si no está en cache
        if: steps.api-cache.outputs.cache-hit != 'true'
        run: |
          echo "Consultando API para $LANG-${{ inputs.month }}-${{ inputs.day }}"
          curl -s -H "User-Agent: GitHub Actions Pipeline" \
            "https://api.wikimedia.org/feed/v1/wikipedia/$LANG/onthisday/selected/${{ inputs.month }}/${{ inputs.day }}" \
            > api-response.json

      - name: Contar eventos obtenidos
        id: count-events
        run: |
          TOTAL_EVENTS=$(jq '.selected | length' api-response.json)
          echo "total=$TOTAL_EVENTS" >> $GITHUB_OUTPUT
          echo "✅ Se encontraron $TOTAL_EVENTS eventos históricos"

      - name: Mostrar preview de eventos
        run: |
          echo "📅 Eventos del ${{ inputs.day }}/${{ inputs.month }}:"
          jq -r '.selected[] | "• \(.pages[0].title)"' api-response.json | head -5
          if [ $(jq '.selected | length' api-response.json) -gt 5 ]; then
            echo "... y más"
          fi

      - name: Guardar datos para uso futuro
        id: save-data
        run: |
          API_DATA=$(cat api-response.json | jq -c .)
          echo "api-data=$API_DATA" >> $GITHUB_OUTPUT

      - name: Subir respuesta como artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-response-$LANG-${{ inputs.month }}-${{ inputs.day }}
          path: api-response.json
          retention-days: 1

      - name: Mostrar resumen final
        run: |
          echo "🎉 Proceso completado"
          echo "Idioma: $LANG"
          echo "Fecha: ${{ inputs.day }}/${{ inputs.month }}"
          echo "Eventos encontrados: ${{ steps.count-events.outputs.total }}"
          echo "Cache hit: ${{ steps.api-cache.outputs.cache-hit }}"
